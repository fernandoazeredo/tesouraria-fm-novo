name: Publicar IA Executiva - Functions e Hosting

# Ativação controlada. O Secret Manager deve conter GOOGLE_GENAI_API_KEY
# e a conta de serviço do GitHub precisa ter permissão de deploy de Functions.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar frontend
        run: |
          npm install --no-package-lock
          npm test
          npm run build
      - name: Validar backend
        run: |
          cd functions
          npm install --no-package-lock
          npm test
          node --check index.js
      - name: Autenticar no Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TESOURARIA_FM_NOVO }}
      - name: Instalar Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
      - name: Verificar credencial de IA no Secret Manager
        run: gcloud secrets describe GOOGLE_GENAI_API_KEY --project tesouraria-fm-novo --format='value(name)'
      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools
      - name: Publicar APENAS Cloud Function da IA
        run: firebase deploy --only functions:executive-ai --project tesouraria-fm-novo --non-interactive
      - name: Publicar APENAS Hosting
        run: firebase deploy --only hosting --project tesouraria-fm-novo --non-interactive
