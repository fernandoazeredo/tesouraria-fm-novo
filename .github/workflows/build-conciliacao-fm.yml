name: Build - Conciliacao Bancaria FM

on:
  push:
    branches:
      - feat/conciliacao-bancaria-fm
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-package-lock
      - name: Validar TypeScript e build Vite
        run: npm run build
