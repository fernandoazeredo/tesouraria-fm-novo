name: Deploy FM Assistente - Hosting FM NOVO

on:
  push:
    branches:
      - feature/fm-assistente-dev-20261020
  workflow_dispatch:

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy-firebase]')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm install --no-package-lock

      - name: Gerar build
        run: npm run build

      - name: Autenticar no Google Cloud / Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TESOURARIA_FM_NOVO }}

      - name: Instalar Firebase CLI
        run: npm install --global firebase-tools

      - name: Criar configuracao isolada de Hosting
        run: |
          cat > firebase.fm-assistente.json <<'EOF'
          {
            "hosting": {
              "site": "tesouraria-fm-novo",
              "public": "dist",
              "ignore": ["firebase.fm-assistente.json", "**/.*", "**/node_modules/**"],
              "rewrites": [
                { "source": "**", "destination": "/index.html" }
              ]
            }
          }
          EOF

      - name: Publicar somente Hosting do Tesouraria FM Novo
        run: firebase deploy --only hosting --project tesouraria-fm-novo --config firebase.fm-assistente.json --non-interactive
