name: Validacao tecnica - Tesouraria FM
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-package-lock
      - name: Validar TypeScript e build Vite
        run: npm run build
      - name: Testar regras e funcionalidades
        run: npm test
      - name: Testar Cloud Functions
        run: npm --prefix functions install --no-package-lock && npm --prefix functions test
