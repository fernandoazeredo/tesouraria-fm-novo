name: Aplicar validacao visual inline - campos do cliente

on:
  push:
    branches:
      - dev-fm-2026-09-08
    paths:
      - '.github/workflows/apply-inline-client-validation.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
        with:
          ref: dev-fm-2026-09-08
          fetch-depth: 0

      - name: Aplicar validacao visual aprovada
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: esperado 1 trecho, encontrado {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # ALVARÁ
          path = 'src/pages/ReceivablesPageStorageV2.tsx'
          replace_once(path,
              "  const [busy, setBusy] = useState(false)\n  const [unidade, setUnidade]",
              "  const [busy, setBusy] = useState(false)\n  const [showClientValidation, setShowClientValidation] = useState(false)\n  const [unidade, setUnidade]",
              'alvara-validation-state')
          replace_once(path,
              "  const uploaded = uploads.flatMap((item) => item.meta ? [item.meta] : [])\n",
              "  const uploaded = uploads.flatMap((item) => item.meta ? [item.meta] : [])\n  const clientBankingIncomplete = !banco.trim() || !agencia.trim() || !conta.trim() || !titular.trim() || !cpf.trim()\n",
              'alvara-validation-derived')
          replace_once(path,
              "    if (status === 'enviado_tesouraria' && liquidoCliente > 0 && (!banco.trim() || !agencia.trim() || !conta.trim() || !titular.trim() || !cpf.trim())) {\n      window.alert('Para realizar o repasse ao cliente, preencha Banco, Agência, Conta, Nome/Titular e CPF.')\n      return\n    }\n",
              "    if (status === 'rascunho') setShowClientValidation(false)\n    if (status === 'enviado_tesouraria' && liquidoCliente > 0 && clientBankingIncomplete) {\n      setShowClientValidation(true)\n      window.requestAnimationFrame(() => {\n        const firstField = document.querySelector('.revenue-sheet .field-validation-error input') as HTMLInputElement | null\n        firstField?.scrollIntoView({ behavior: 'smooth', block: 'center' })\n        firstField?.focus()\n      })\n      return\n    }\n    if (status === 'enviado_tesouraria') setShowClientValidation(false)\n",
              'alvara-validation-behavior')
          replace_once(path,
              "    <h3 className=\"form-section-title\">Dados bancários para crédito do cliente</h3>\n    <div className=\"form-grid compact-grid\">\n      <label><span>Banco *</span><input value={banco} required={liquidoCliente > 0} onChange={(e) => setBanco(e.target.value)} /></label>\n      <label><span>Agência *</span><input value={agencia} required={liquidoCliente > 0} onChange={(e) => setAgencia(e.target.value)} /></label>\n      <label><span>Conta *</span><input value={conta} required={liquidoCliente > 0} onChange={(e) => setConta(e.target.value)} /></label>\n      <label className=\"span-2\"><span>Nome / Titular *</span><input value={titular} required={liquidoCliente > 0} onChange={(e) => setTitular(e.target.value)} /></label>\n      <label><span>CPF *</span><input value={cpf} required={liquidoCliente > 0} onChange={(e) => setCpf(e.target.value)} /></label>\n      <label className=\"span-2\"><span>PIX (opcional)</span><input value={pix} onChange={(e) => setPix(e.target.value)} /></label>\n    </div>",
              "    <h3 className=\"form-section-title\">Dados bancários para crédito do cliente</h3>\n    {showClientValidation && liquidoCliente > 0 && clientBankingIncomplete && <div className=\"form-validation-summary\" role=\"alert\">Preencha os campos destacados para continuar.</div>}\n    <div className=\"form-grid compact-grid\">\n      <label className={showClientValidation && !banco.trim() ? 'field-validation-error' : ''}><span>Banco *</span><input value={banco} required={liquidoCliente > 0} aria-invalid={showClientValidation && !banco.trim()} onChange={(e) => setBanco(e.target.value)} />{showClientValidation && !banco.trim() && <small className=\"field-validation-message\">Campo obrigatório</small>}</label>\n      <label className={showClientValidation && !agencia.trim() ? 'field-validation-error' : ''}><span>Agência *</span><input value={agencia} required={liquidoCliente > 0} aria-invalid={showClientValidation && !agencia.trim()} onChange={(e) => setAgencia(e.target.value)} />{showClientValidation && !agencia.trim() && <small className=\"field-validation-message\">Campo obrigatório</small>}</label>\n      <label className={showClientValidation && !conta.trim() ? 'field-validation-error' : ''}><span>Conta *</span><input value={conta} required={liquidoCliente > 0} aria-invalid={showClientValidation && !conta.trim()} onChange={(e) => setConta(e.target.value)} />{showClientValidation && !conta.trim() && <small className=\"field-validation-message\">Campo obrigatório</small>}</label>\n      <label className={`span-2${showClientValidation && !titular.trim() ? ' field-validation-error' : ''}`}><span>Nome / Titular *</span><input value={titular} required={liquidoCliente > 0} aria-invalid={showClientValidation && !titular.trim()} onChange={(e) => setTitular(e.target.value)} />{showClientValidation && !titular.trim() && <small className=\"field-validation-message\">Campo obrigatório</small>}</label>\n      <label className={showClientValidation && !cpf.trim() ? 'field-validation-error' : ''}><span>CPF *</span><input value={cpf} required={liquidoCliente > 0} aria-invalid={showClientValidation && !cpf.trim()} onChange={(e) => setCpf(e.target.value)} />{showClientValidation && !cpf.trim() && <small className=\"field-validation-message\">Campo obrigatório</small>}</label>\n      <label className=\"span-2\"><span>PIX (opcional)</span><input value={pix} onChange={(e) => setPix(e.target.value)} /></label>\n    </div>",
              'alvara-validation-ui')

          # ACORDO TRABALHISTA
          path = 'src/components/LaborAgreementReceivable.tsx'
          replace_once(path,
              "  const [busy, setBusy] = useState(false)\n  const [unidade, setUnidade]",
              "  const [busy, setBusy] = useState(false)\n  const [showClientValidation, setShowClientValidation] = useState(false)\n  const [unidade, setUnidade]",
              'acordo-validation-state')
          replace_once(path,
              "  const liquidoClienteRecebido = useMemo(() => realizadas.reduce((sum, row) => sum + row.liquidoCliente, 0), [realizadas])\n",
              "  const liquidoClienteRecebido = useMemo(() => realizadas.reduce((sum, row) => sum + row.liquidoCliente, 0), [realizadas])\n  const clientDataIncomplete = !bancoCliente.trim() || !agenciaCliente.trim() || !contaCliente.trim() || !titularCliente.trim() || !cpfCliente.trim() || !emailCliente.trim() || !telefoneCliente.trim() || !enderecoCliente.trim()\n",
              'acordo-validation-derived')
          replace_once(path,
              "    if (status === 'enviado_tesouraria' && liquidoClienteRecebido > 0 && (!titularCliente.trim() || !cpfCliente.trim() || !bancoCliente.trim() || !agenciaCliente.trim() || !contaCliente.trim() || !emailCliente.trim() || !telefoneCliente.trim() || !enderecoCliente.trim())) {\n      window.alert('Para realizar o repasse ao cliente, preencha todos os dados obrigatórios do cliente: Nome/Titular, CPF, Banco, Agência, Conta Corrente, E-mail, Telefone e Endereço.')\n      return\n    }\n",
              "    if (status === 'rascunho') setShowClientValidation(false)\n    if (status === 'enviado_tesouraria' && liquidoClienteRecebido > 0 && clientDataIncomplete) {\n      setShowClientValidation(true)\n      window.requestAnimationFrame(() => {\n        const firstField = document.querySelector('.labor-agreement-sheet .field-validation-error input') as HTMLInputElement | null\n        firstField?.scrollIntoView({ behavior: 'smooth', block: 'center' })\n        firstField?.focus()\n      })\n      return\n    }\n    if (status === 'enviado_tesouraria') setShowClientValidation(false)\n",
              'acordo-validation-behavior')
          replace_once(path,
              "    <h3 className=\"form-section-title\">Dados bancários e contato do cliente</h3>\n    <div className=\"form-grid compact-grid labor-agreement-grid\">\n      <label><span>Banco *</span><input value={bancoCliente} required={liquidoClienteRecebido > 0} onChange={(e) => setBancoCliente(e.target.value)} /></label>\n      <label><span>Agência *</span><input value={agenciaCliente} required={liquidoClienteRecebido > 0} onChange={(e) => setAgenciaCliente(e.target.value)} /></label>\n      <label><span>Conta Corrente *</span><input value={contaCliente} required={liquidoClienteRecebido > 0} onChange={(e) => setContaCliente(e.target.value)} /></label>\n      <label><span>Nome / Titular *</span><input value={titularCliente} required={liquidoClienteRecebido > 0} onChange={(e) => setTitularCliente(e.target.value)} /></label>\n      <label><span>CPF *</span><input value={cpfCliente} required={liquidoClienteRecebido > 0} onChange={(e) => setCpfCliente(e.target.value)} /></label>\n      <label><span>PIX (opcional)</span><input value={pixCliente} onChange={(e) => setPixCliente(e.target.value)} /></label>\n      <label><span>E-mail *</span><input type=\"email\" value={emailCliente} required={liquidoClienteRecebido > 0} onChange={(e) => setEmailCliente(e.target.value)} /></label>\n      <label><span>Telefone *</span><input value={telefoneCliente} required={liquidoClienteRecebido > 0} onChange={(e) => setTelefoneCliente(e.target.value)} /></label>\n      <label className=\"span-2\"><span>Endereço *</span><input value={enderecoCliente} required={liquidoClienteRecebido > 0} onChange={(e) => setEnderecoCliente(e.target.value)} /></label>\n    </div>",
              "    <h3 className=\"form-section-title\">Dados bancários e contato do cliente</h3>\n    {showClientValidation && liquidoClienteRecebido > 0 && clientDataIncomplete && <div className=\"form-validation-summary\" role=\"alert\">Preencha os campos destacados para continuar.</div>}\n    <div className=\"form-grid compact-grid labor-agreement-grid\">\n      <label className={showClientValidation && !bancoCliente.trim() ? 'field-validation-error' : ''}><span>Banco *</span><input value={bancoCliente} required={liquidoClienteRecebido > 0} aria-invalid={showClientValidation && !bancoCliente.trim()} onChange={(e) => setBancoCliente(e.target.value)} />{showClientValidation && !bancoCliente.trim() && <small className=\"field-validation-message\">Campo obrigatório</small>}</label>\n      <label className={showClientValidation && !agenciaCliente.trim() ? 'field-validation-error' : ''}><span>Agência *</span><input value={agenciaCliente} required={liquidoClienteRecebido > 0} aria-invalid={showClientValidation && !agenciaCliente.trim()} onChange={(e) => setAgenciaCliente(e.target.value)} />{showClientValidation && !agenciaCliente.trim() && <small className=\"field-validation-message\">Campo obrigatório</small>}</label>\n      <label className={showClientValidation && !contaCliente.trim() ? 'field-validation-error' : ''}><span>Conta Corrente *</span><input value={contaCliente} required={liquidoClienteRecebido > 0} aria-invalid={showClientValidation && !contaCliente.trim()} onChange={(e) => setContaCliente(e.target.value)} />{showClientValidation && !contaCliente.trim() && <small className=\"field-validation-message\">Campo obrigatório</small>}</label>\n      <label className={showClientValidation && !titularCliente.trim() ? 'field-validation-error' : ''}><span>Nome / Titular *</span><input value={titularCliente} required={liquidoClienteRecebido > 0} aria-invalid={showClientValidation && !titularCliente.trim()} onChange={(e) => setTitularCliente(e.target.value)} />{showClientValidation && !titularCliente.trim() && <small className=\"field-validation-message\">Campo obrigatório</small>}</label>\n      <label className={showClientValidation && !cpfCliente.trim() ? 'field-validation-error' : ''}><span>CPF *</span><input value={cpfCliente} required={liquidoClienteRecebido > 0} aria-invalid={showClientValidation && !cpfCliente.trim()} onChange={(e) => setCpfCliente(e.target.value)} />{showClientValidation && !cpfCliente.trim() && <small className=\"field-validation-message\">Campo obrigatório</small>}</label>\n      <label><span>PIX (opcional)</span><input value={pixCliente} onChange={(e) => setPixCliente(e.target.value)} /></label>\n      <label className={showClientValidation && !emailCliente.trim() ? 'field-validation-error' : ''}><span>E-mail *</span><input type=\"email\" value={emailCliente} required={liquidoClienteRecebido > 0} aria-invalid={showClientValidation && !emailCliente.trim()} onChange={(e) => setEmailCliente(e.target.value)} />{showClientValidation && !emailCliente.trim() && <small className=\"field-validation-message\">Campo obrigatório</small>}</label>\n      <label className={showClientValidation && !telefoneCliente.trim() ? 'field-validation-error' : ''}><span>Telefone *</span><input value={telefoneCliente} required={liquidoClienteRecebido > 0} aria-invalid={showClientValidation && !telefoneCliente.trim()} onChange={(e) => setTelefoneCliente(e.target.value)} />{showClientValidation && !telefoneCliente.trim() && <small className=\"field-validation-message\">Campo obrigatório</small>}</label>\n      <label className={`span-2${showClientValidation && !enderecoCliente.trim() ? ' field-validation-error' : ''}`}><span>Endereço *</span><input value={enderecoCliente} required={liquidoClienteRecebido > 0} aria-invalid={showClientValidation && !enderecoCliente.trim()} onChange={(e) => setEnderecoCliente(e.target.value)} />{showClientValidation && !enderecoCliente.trim() && <small className=\"field-validation-message\">Campo obrigatório</small>}</label>\n    </div>",
              'acordo-validation-ui')

          # ESTILO VISUAL COMPARTILHADO
          css_path = Path('src/styles.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* Validacao visual inline dos campos obrigatorios do cliente */'
          if marker not in css:
              css += '''\n\n/* Validacao visual inline dos campos obrigatorios do cliente */\n.form-validation-summary { margin: 0 0 12px; border: 1px solid rgba(220, 38, 38, .42); background: rgba(220, 38, 38, .08); color: #b91c1c; border-radius: 10px; padding: 10px 12px; font-size: 13px; font-weight: 800; }\n.field-validation-error > span:first-child { color: #b91c1c !important; font-weight: 800; }\n.field-validation-error input, .field-validation-error select, .field-validation-error textarea { border-color: #dc2626 !important; background: rgba(220, 38, 38, .06) !important; box-shadow: 0 0 0 3px rgba(220, 38, 38, .12) !important; animation: required-field-pulse .45s ease-out; }\n.field-validation-error input:focus, .field-validation-error select:focus, .field-validation-error textarea:focus { border-color: #b91c1c !important; box-shadow: 0 0 0 4px rgba(220, 38, 38, .18) !important; }\n.field-validation-message { color: #b91c1c; font-size: 11px; font-weight: 800; line-height: 1.2; }\n@keyframes required-field-pulse { 0% { transform: scale(.995); } 55% { transform: scale(1.01); } 100% { transform: scale(1); } }\n@media (prefers-reduced-motion: reduce) { .field-validation-error input, .field-validation-error select, .field-validation-error textarea { animation: none; } }\n'''
              css_path.write_text(css, encoding='utf-8')
          PY

      - name: Remover workflow temporario
        run: git rm .github/workflows/apply-inline-client-validation.yml

      - name: Instalar dependencias
        run: npm install --no-package-lock

      - name: Validar build
        run: npm run build

      - name: Commitar e publicar
        shell: bash
        run: |
          git config user.name "Fernando Azeredo - automacao"
          git config user.email "132702186+fernandoazeredo@users.noreply.github.com"
          git add -A src .github/workflows
          git commit -m "[deploy-firebase] Melhora validacao visual dos campos obrigatorios"
          git push origin HEAD:dev-fm-2026-09-08
